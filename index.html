<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex">
<meta name="description" content="Cartão digital MENSURA Engenharia">
<title>MENSURA Engenharia | Cartão digital</title>
<link rel="icon" href="assets/icone.png">
<link rel="apple-touch-icon" href="assets/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#080D0B;--panel:#0B1411;--text:#F9F9F7;--muted:#C1C8C3;
  --accent:#2F6F5E;--accent-soft:#79AD84;--hair:#293C33;--button-border:#385044;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;min-height:100dvh;
  font-family:Inter,Arial,sans-serif;font-size:16px;line-height:1.5;color:var(--text);
  background:var(--bg);display:flex;justify-content:center;align-items:center;
  padding:24px 16px;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
.card{
  position:relative;isolation:isolate;width:min(100%,440px);
  background:var(--panel);border:1px solid var(--hair);border-radius:22px;
  box-shadow:0 24px 64px rgba(0,0,0,.24);
}
.card::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;
  background:
    linear-gradient(135deg,transparent 0 29%,rgba(121,173,132,.065) 29% calc(29% + 1px),transparent calc(29% + 1px)),
    linear-gradient(135deg,transparent 0 38%,rgba(121,173,132,.04) 38% calc(38% + 1px),transparent calc(38% + 1px)),
    linear-gradient(90deg,transparent calc(100% - 30px),rgba(121,173,132,.05) calc(100% - 30px) calc(100% - 29px),transparent calc(100% - 29px));
}
.content{padding:34px 28px 26px}
.logo{display:block;width:100%;max-width:208px;height:auto;margin:0 auto}
.eyebrow{
  margin:26px 0 16px;text-align:center;color:var(--accent-soft);
  font-size:10px;font-weight:600;letter-spacing:.2em;line-height:1.6;text-transform:uppercase;
}
.name{
  text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:600;
  font-size:clamp(34px,10.8vw,44px);line-height:1.12;letter-spacing:-.025em;
  margin:0;text-wrap:balance;overflow-wrap:break-word;
}
.role{text-align:center;color:var(--muted);font-size:15px;line-height:1.5;margin:12px 0 0}
.line{height:1px;background:linear-gradient(90deg,transparent,var(--button-border),transparent);margin:26px 0}
.buttons{display:grid;gap:11px}
.btn{
  display:grid;grid-template-columns:20px minmax(0,1fr) 8px;align-items:center;gap:14px;
  min-height:56px;padding:15px 17px;border-radius:10px;
  font-size:14px;line-height:1.5;font-weight:500;text-decoration:none;
  color:var(--text);background:#0D1813;border:1px solid var(--button-border);
  -webkit-tap-highlight-color:rgba(121,173,132,.18);
  transition:background-color .18s,border-color .18s;
}
.btn span{min-width:0;overflow-wrap:break-word}
.btn::after{
  content:"";width:6px;height:6px;justify-self:end;
  border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg);opacity:.65;
}
.btn:hover{background:#172A21;border-color:var(--accent-soft)}
.btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:4px}
.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#377C69;border-color:#79AD84}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notice{margin:16px 0 0;color:#E0A23B;font-size:12px;line-height:1.5;text-align:center}
.notice:empty{display:none}
.foot{margin-top:25px;padding-top:21px;border-top:1px solid var(--hair);text-align:center}
.org-name{color:var(--text);font-size:12px;font-weight:500;letter-spacing:.035em;margin-bottom:8px}
.axes{color:var(--accent-soft);font-size:10px;font-weight:500;line-height:1.9;letter-spacing:.14em;text-transform:uppercase;text-wrap:balance}
@media (max-width:360px){
  body{padding:16px 12px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .content{padding:28px 20px 23px}
  .logo{max-width:190px}
  .btn{gap:11px;padding:14px 13px;font-size:13px}
  .axes{letter-spacing:.09em}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main class="card">
  <div class="content">
    <header>
      <img class="logo" src="assets/mensura-logo.png" width="1084" height="260" alt="MENSURA Engenharia">
    </header>
    <div class="eyebrow">Cartão de visita digital</div>
    <h1 class="name" id="name">Alexandre Aguiar</h1>
    <p class="role" id="role">Diretor Técnico</p>
    <div class="line" aria-hidden="true"></div>
    <nav class="buttons" aria-label="Contato">
      <a class="btn primary" href="contato.vcf" download="Alexandre-Aguiar-MENSURA.vcf"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="9" r="3"/><path d="M6 19c0-4 12-4 12 0"/></svg><span>Salvar contato</span></a>
      <a class="btn" id="whatsapp" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.7 7.1L4 20l1.4-4.3A8 8 0 1 1 20 11.5Z"/><path d="m9 9 1 2 2 2 2 1 1-1"/></svg><span>Conversar pelo WhatsApp</span></a>
      <a class="btn" id="presentation" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16v18H4zM8 8h8M8 12h8M8 16h5"/></svg><span>Conhecer a MENSURA</span></a>
      <a class="btn" id="email" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg><span>Enviar e-mail</span></a>
    </nav>
    <p class="notice" id="notice"></p>
    <footer class="foot">
      <div class="org-name">MENSURA Engenharia</div>
      <div class="axes">Planejamento · Controle · Decisão</div>
    </footer>
  </div>
</main>
<script src="config.js"></script>
<script>
const c=window.MENSURA_CONFIG||{};
if(c.nome){document.querySelector('#name').textContent=c.nome;document.title=c.nome+' | MENSURA Engenharia'}
if(c.cargo)document.querySelector('#role').textContent=c.cargo;
function setup(id,href){const el=document.getElementById(id);if(href){el.href=href;el.target=id==='presentation'?'_blank':'_self';if(id==='presentation')el.rel='noopener noreferrer'}else{el.addEventListener('click',e=>{e.preventDefault();alert('Este botão será ativado após configurar os dados profissionais.')})}}
setup('whatsapp',c.whatsapp?`https://wa.me/${c.whatsapp.replace(/\D/g,'')}`:null);
setup('presentation',c.apresentacao||null);
setup('email',c.email?`mailto:${c.email}`:null);
if(!(c.whatsapp&&c.email&&c.apresentacao))document.querySelector('#notice').textContent='Alguns botões aguardam a configuração dos dados profissionais.';
</script>
</body>
</html>
